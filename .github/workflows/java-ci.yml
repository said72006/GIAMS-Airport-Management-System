name: Java build and model tests
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile application and smoke tests
        run: |
          mkdir -p build
          find src tests -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -d build
      - name: Run model tests
        run: java -Djava.awt.headless=true -cp build SmokeTest
